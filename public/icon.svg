<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="8" />

  <!-- Center Decorative Glow -->
  <circle cx="256" cy="256" r="140" fill="#10b981" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Bowl / Nutrition Emblem -->
  <g transform="translate(64, 74) scale(0.75)">
    <!-- Plate / Bowl Outer -->
    <path d="M 60 260 C 60 410, 452 410, 452 260 Z" fill="url(#emeraldGrad)" />
    <!-- Plate Inner / Soup / Fresh food curve -->
    <ellipse cx="256" cy="260" rx="196" ry="40" fill="#047857" />
    <ellipse cx="256" cy="256" rx="180" ry="34" fill="#065f46" />

    <!-- Healthy Leaf / Plant Sprout Rising -->
    <path d="M 256 250 C 230 180, 150 140, 130 80 C 200 80, 240 140, 256 250 Z" fill="url(#accentGrad)" />
    <path d="M 256 250 C 280 170, 360 130, 382 70 C 310 70, 270 130, 256 250 Z" fill="#10b981" />
    <path d="M 256 250 Q 256 120 256 40 Q 275 140 256 250 Z" fill="#6ee7b7" />

    <!-- Sparkle Stars -->
    <path d="M 390 160 Q 390 190 420 190 Q 390 190 390 220 Q 390 190 360 190 Q 390 190 390 160 Z" fill="#a7f3d0" />
    <path d="M 120 190 Q 120 210 140 210 Q 120 210 120 230 Q 120 210 100 210 Q 120 210 120 190 Z" fill="#34d399" />
  </g>
</svg>
